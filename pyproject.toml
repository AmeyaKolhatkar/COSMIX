[build-system]
requires = ["setuptools>=61.0", "wheel", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "pycosmix"
dynamic = ["version"]
description = "A Bayesian Inference Pipeline for Modified Gravity"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Ameya Kolhatkar", email = "kolhatkarameya1996@gmail.com" }
]
keywords = ["cosmology", "sampling", "MCMC", "inference", "modified-gravity"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Astronomy"
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "getdist>=1.4",
    "numba>=0.58",
    "tqdm",
    "emcee>=3.1",
    "dynesty>=2.1,<3.0",
    "camb"
]

[project.urls]
Homepage = "https://github.com/AmeyaKolhatkar/COSMIX"
Documentation = "https://cosmix.readthedocs.io/en/latest/readme.html"
Licensing = "https://github.com/AmeyaKolhatkar/COSMIX/blob/master/LICENSE"

[project.scripts]
cosmix = "cosmix.run_cosmix:cli_entry"

[tool.setuptools_scm]

[project.optional-dependencies]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0"
]

[tool.setuptools.package-data]
"*" = ["data/**/*", "*.dat", "*.cov", "*.txt"]

[tool.setuptools.packages.find]
where = ["src"]
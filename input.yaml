run:
  name: "As Followup"
  description: "PIP TEST"
  run_id: "cosmix_pip_test_CCMB"   

model:
  name: LCDM 

likelihoods:  
  - name: compressedcmb 

# ── emcee (MCMC) ────────────────────────────────────────────────────────────
#sampler:
#  name: emcee
#  init: 
#    random_seed: 42
#  run: 
#    nsteps: 1000
#    burn_in: 0
  
convergence:
  mode: multi_fixed            # "single" / "multi_fixed" / "multi_auto"   UNDER CONSTRUCTION
  nchains: 4
  ncores: 4
  rhat_tol: 0.01 
  ess_min: 1000
  tau_factor: 50
  check_every: 50            # check convergence every N steps (chains run continuously)
  max_steps: 50000            # hard stop if convergence not reached

# ── Dynesty (nested sampling) ────────────────────────────────────────────────
# To use Dynesty, replace the sampler block above with this block.
# The convergence block is NOT required for nested samplers; remove it or leave it.
#
sampler:
  name: dynesty
  init:
    nlive: 500           # 25×ndim is sufficient; 6000 was 800× overkill for 7D
    sample: rslice       # slice sampler handles sigma80-lambda0 degeneracy; rwalk stalls
    n_cpu: 1             # CPU cores for parallel likelihood evaluation (default 1 = serial)
#
# ── PolyChord (nested sampling) ──────────────────────────────────────────────
# To use PolyChord, replace the sampler block above with this block.
# Requires pypolychord to be installed (see installation instructions).
#
#sampler:
#  name: polychord
#  init:
#    nlive: 250           # default 25*ndim; PolyChord is efficient with fewer live pts
#    num_repeats: 20      # default 5*ndim; increase for degenerate posteriors
#    precision_criterion: 0.001
#    base_dir: chains
#    file_root: cosmix_run

outputs:
  plots:
    trace: true
    corner: true
    residual: true

  archive: true

# ── Dataset overlap check ─────────────────────────────────────────────────────
# Detects measurements from the same galaxy survey appearing in more than one
# likelihood (e.g. VIPERS fσ₈ in RSD and VIPERS E_G in EgStatistic share the
# same underlying PDR-2 spectroscopic catalog).
#
# enabled         : set to true to run the check before launching chains.
# z_tol           : max |Δz| between two points to be considered co-located.
# abort_on_overlap: true  = hard-stop if any overlap is found (safe default).
#                   false = print the report and continue (document the caveat).
overlap_check:
  enabled: true
  z_tol: 0.01
  abort_on_overlap: false